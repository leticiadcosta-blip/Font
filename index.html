<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oficina mecânica - login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card-login">

    
   
    <div class="lado-esquerdo">
      <h1>Holleycarros</h1>
      <p class="subtitulo">Sistema de Gestão de Veículos</p>
      <p>Controle seus veículos, clientes e vendas em um só lugar.</p>
    </div>

 
    <div class="lado-direito">
      <h2>Bem-vindo(a)!</h2>
      <p class="subtitulo-form">Faça login para continuar.</p>

      <form>
        <div class="campo">
          <label for="usuario">Usuário</label>
          <input type="text" id="usuario" placeholder="Digite seu usuário">
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Digite sua senha">
          
        </div>

       
        <a href="telainicial.html">
  <button type="button">Entrar</button>
</a>
       

        
      </form>
    </div>

  </div>

</body>

</html>
